<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Syne+Mono&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --body-bg: #F2F7FC;
  --primary: #F77EC3;
  --primary-dark: #F2DCE7;
  --white: #301F9C;
  --gray: #E07097;
}
body {
  background-color: var(--body-bg);
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1rem;
  font-family: sans-serif;
}
.container {
  width: 100%;
  max-width: 400px;
}
.quiz-progress {
  display: flex;
  justify-content: space-evenly;
  gap: 0.5rem;
}
.quiz-progress span {
  width: 100%;
  height: 3px;
  border-radius: 25px;
  background-color: var(--gray);
}
.quiz-progress span.seen {
  background-color: var(--primary-dark);
}
.question-container {
  margin: 2rem auto;
  font-size: 1.5rem;
  font-family: "Alfa Slab One", serif;
  font-weight: 400;
  font-style: normal;
}
.question-container p:first-of-type {
  color: var(--gray);
}
.question-container p:last-of-type {
  font-size: 2.2rem;
  color: var(--white);
}
.answer-container button {
  display: block;
  width: 100%;
  padding: 1rem 0.5rem;
  border-radius: 3rem;
  border: none;
  font-size: 1.5rem;
  margin: 0.5rem auto;
  background-color: var(--body-bg);
  border: 2px solid var(--white);
  color: darkblue;
  transition: all 0.2s ease;
  cursor: pointer;
  font-family: "Montserrat", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
}
.answer-container button:hover {
  background-color: var(--primary-dark);
  color: var(--primary);
  border-color: var(--primary);
}
.result-label {
  color: var(--gray);
  font-size: 1.5rem;
}
.result-title {
  font-size: 2.2rem;
  color: var(--white);
}
.result-desc {
  font-family: "Montserrat", sans-serif;
  font-size: 1rem;
  color: var(--white);
  line-height: 1.6;
  margin-top: 1rem;
  opacity: 0.8;
}
.result-emoji {
  font-size: 4rem;
  display: block;
  margin: 1rem 0 0.5rem;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="quiz-progress" id="quizProgress"></div>
    <div class="question-container" id="questionContainer"></div>
    <div class="answer-container" id="answerContainer"></div>
  </div>
  <script>
    const questions = [
      {
        topic: "question 1",
        question: "what is your favorite genre?",
        possibleAnswers: ["mystery", "nonfiction", "sci-fi/fantasy", "literary fiction"],
        projectHailMary: "sci-fi/fantasy",
        theSecretHistory: "mystery",
        severance: "literary fiction",
        educated: "nonfiction",
      },
      {
        topic: "question 2",
        question: "what's your favorite season?'",
        possibleAnswers: ["spring", "autumn", "winter", "summer"],
        projectHailMary: "spring",
        theSecretHistory: "autumn",
        severance: "winter",
        educated: "summer",
      },
      {
        topic: "question 3",
        question: "what does your typical saturday look like?",
        possibleAnswers: ["hikes & adventures through nature", "a museum day", "doing work", "reading at home"],
        projectHailMary: "hikes & adventures through nature",
        theSecretHistory: "a museum day",
        severance: "doing work",
        educated: "reading at home",
      },
      {
        topic: "question 4",
        question: "what mood are you looking for?",
        possibleAnswers: ["hopeful and adventurous", "dark and suspenseful", "quietly unsettling", "raw and inspiring"],
        projectHailMary: "hopeful and adventurous",
        theSecretHistory: "dark and suspenseful",
        severance: "eerie and unsettling",
        educated: "raw and inspiring",
      },
    ];
 
    const bookInfo = {
      projectHailMary: {
        title: "Project Hail Mary",
        emoji: "🚀",
        desc: "an astronaut with amnesia finds himself alone in space. a thrilling & heartwarming story from andy weir, writer of the martian"
      },
      theSecretHistory: {
        title: "The Secret History",
        emoji: "🏛️",
        desc: "a group of elite classics students, a murder covered up, and a story told in reverse. dark and gripping."
      },
      severance: {
        title: "Severance",
        emoji: "🏙️",
        desc: "shen fever - an illness that makes individuals repeat their daily routines until death - nearly wipes out all civilization. a young woman drifts through a surreal new york as the world ends. a melancholic take on capitalism, culture, and the world around us"
      },
      educated: {
        title: "Educated",
        emoji: "📖",
        desc: "the memoir of a woman who grew up in the mountains in an ultra-religious environment, never went to school, and eventually earned a PhD from Cambridge. unforgettable."
      },
    };
 
    const scores = { projectHailMary: 0, theSecretHistory: 0, severance: 0, educated: 0 };
    let currentQuestionIndex = 0;
 
    const quizProgress = document.getElementById("quizProgress");
    const questionContainer = document.getElementById("questionContainer");
    const answerContainer = document.getElementById("answerContainer");
 
    function handleQuestion(index) {
      quizProgress.innerHTML = "";
      questions.forEach(() => quizProgress.innerHTML += "<span></span>");
      document.querySelectorAll("#quizProgress span").forEach((s, i) => {
        if (i <= index) s.classList.add("seen");
      });
 
      questionContainer.innerHTML = `<p>${questions[index].topic}</p><p>${questions[index].question}</p>`;
      answerContainer.innerHTML = "";
 
      questions[index].possibleAnswers.forEach((answer) => {
        const btn = document.createElement("button");
        btn.textContent = answer;
        btn.addEventListener("click", () => {
          const q = questions[index];
          Object.keys(scores).forEach(key => { if (q[key] === answer) scores[key]++; });
          if (currentQuestionIndex === questions.length - 1) {
            showResult();
          } else {
            currentQuestionIndex++;
            handleQuestion(currentQuestionIndex);
          }
        });
        answerContainer.appendChild(btn);
      });
    }
 
    function showResult() {
      const winner = Object.keys(scores).reduce((a, b) => scores[a] >= scores[b] ? a : b);
      const book = bookInfo[winner];
 
      quizProgress.innerHTML = "";
      questions.forEach(() => {
        const s = document.createElement("span");
        s.classList.add("seen");
        quizProgress.appendChild(s);
      });
 
      questionContainer.innerHTML = `<p class="result-label">your book is…</p><span class="result-emoji">${book.emoji}</span><p class="result-title">${book.title}</p>`;
 
      answerContainer.innerHTML = "";
      const desc = document.createElement("p");
      desc.className = "result-desc";
      desc.textContent = book.desc;
      answerContainer.appendChild(desc);
 
      const retry = document.createElement("button");
      retry.textContent = "try again";
      retry.style.marginTop = "1.5rem";
      retry.addEventListener("click", () => {
        Object.keys(scores).forEach(k => scores[k] = 0);
        currentQuestionIndex = 0;
        handleQuestion(0);
      });
      answerContainer.appendChild(retry);
    }
 
    handleQuestion(0);
  </script>
</body>
</html>
